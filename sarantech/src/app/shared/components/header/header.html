<header class="site-header">
  <div class="container bar">
    <a routerLink="/" (click)="closeMenu()" class="logo" aria-label="SaranTech home">
      <span class="logo-mark" aria-hidden="true">S</span>
      <span class="logo-text">{{ siteName }}</span>
    </a>

    <nav class="nav" [class.nav--open]="menuOpen()" aria-label="Primary">
      @for (link of links; track link.label) {
        <a
          [routerLink]="link.path"
          [fragment]="link.fragment"
          [routerLinkActive]="link.fragment ? '' : 'active'"
          [routerLinkActiveOptions]="{ exact: link.path === '/' }"
          (click)="closeMenu()"
        >{{ link.label }}</a>
      }
      <a routerLink="/contact" class="btn btn--primary btn--sm nav-cta" (click)="closeMenu()">Start Your Project</a>
    </nav>

    <button
      type="button"
      class="menu-toggle"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="primary-nav"
      aria-label="Toggle menu"
    >
      <app-icon [name]="menuOpen() ? 'close' : 'menu'" [size]="22" />
    </button>
  </div>
</header>
