<app-page-header
  kicker="FAQ"
  title="Frequently asked questions"
  subtitle="Honest answers — without guaranteed timelines or pricing until we've discussed your project."
/>

<section class="section">
  <div class="container">
    <div class="faq-list">
      @for (item of faqs; track item.question; let i = $index) {
        <div class="faq-item">
          <button type="button" class="faq-q" (click)="toggle(i)" [attr.aria-expanded]="openIndex() === i">
            <span>{{ item.question }}</span>
            <span class="plus" aria-hidden="true">{{ openIndex() === i ? '−' : '+' }}</span>
          </button>
          @if (openIndex() === i) {
            <p class="faq-a">{{ item.answer }}</p>
          }
        </div>
      }
    </div>
  </div>
</section>
